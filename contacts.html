<main>
<h1>Contact me</h1>
<section class="stitch">
<form id="contactForm" novalidate>
<div><label for="name">Name</label><input type="text" id="name" autocomplete="name"><p class="err" id="nameErr"></p></div>
<div><label for="email">Email address</label><input type="text" id="email" autocomplete="email"><p class="err" id="emailErr"></p></div>
<div><label for="phone">Phone number</label><input type="text" id="phone" inputmode="numeric" autocomplete="tel"><p class="err" id="phoneErr"></p></div>
<div><label for="message">Message</label><textarea id="message" rows="5"></textarea><p class="err" id="messageErr"></p></div>
<button class="btn" type="submit">Send message</button>
</form>
<div id="formStatus" aria-live="polite"></div>
</section>
